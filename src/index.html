<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Charcha Live</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Charchalive: curated content from authentic sources, with perspectives rather than prejudices.">
  <meta name="theme-color" content="#c03426">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tiro+Devanagari+Hindi&display=swap">
  <script>
    // Apply the saved theme before Angular boots so there is no flash of the default colours.
    (function () {
      var root = document.documentElement;
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem('charcha.theme') || '{}') || {}; } catch (e) {}
      var mode = saved.mode || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
