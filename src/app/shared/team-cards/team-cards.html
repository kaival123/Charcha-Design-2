<ul class="container members">
  @for (p of profiles; track p.slug) {
    <li class="member card">
      <img class="member__photo" [src]="p.photo" alt="" loading="lazy" width="72" height="72" />
      <h3>{{ p.name }}</h3>
      <p class="member__tagline">{{ p.tagline }}</p>
      <p class="member__summary">{{ p.summary }}</p>
      <a class="member__link" routerLink="/team" [fragment]="p.slug">
        Read full profile <span aria-hidden="true">→</span>
        <span class="visually-hidden">of {{ p.name }}</span>
      </a>
    </li>
  }
</ul>
